name: sorteador_pro
description: Sorteador de times rapido, justo e compartilhavel.
publish_to: "none"

version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  confetti: ^0.8.0
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.2
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lottie: ^3.3.1
  path_provider: ^2.1.3
  riverpod_annotation: ^2.3.5
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.2.3
  toastification: ^3.0.3

dev_dependencies:
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icon/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
